<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.K. SERVICE - Partner App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen pb-12">

    <!-- LOGIN SCREEN -->
    <div id="authScreen" class="max-w-md mx-auto p-4 pt-10">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-2xl space-y-5">
            <div class="text-center">
                <h1 class="text-2xl font-black text-blue-400">M.K. SERVICE</h1>
                <p class="text-xs text-gray-400">सर्विस पार्टनर पोर्टल (लॉगिन / साइनअप)</p>
            </div>

            <!-- Mobile Login Section -->
            <div id="loginStep" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">अपना मोबाइल नंबर डालें</label>
                    <input type="tel" id="loginPhone" placeholder="10 अंकों का मोबाइल नंबर" pattern="[0-9]{10}" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white outline-none">
                </div>
                <button onclick="handlePhoneSubmit()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">
                    आगे बढ़ें (Login)
                </button>
            </div>

            <!-- New Registration Form -->
            <div id="regForm" class="hidden space-y-3 pt-2 border-t border-gray-700">
                <h3 class="font-bold text-sm text-yellow-400">नया खाता बनाएं (Profile Details)</h3>
                <input type="text" id="regName" placeholder="आपका नाम" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded text-xs outline-none">
                <input type="text" id="regAddress" placeholder="पता (दानापुर/पटना)" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded text-xs outline-none">
                <select id="regExpert" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded text-xs outline-none text-white">
                    <option value="AC Specialist">AC एक्सपर्ट</option>
                    <option value="Refrigerator Tech">रेफ्रिजरेटर (फ्रिज) एक्सपर्ट</option>
                    <option value="Washing Machine Specialist">वाशिंग मशीन एक्सपर्ट</option>
                    <option value="All-in-One Tech">ऑल-इन-वन टेक्नीशियन</option>
                </select>
                <button onclick="completeRegistration()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded text-xs">
                    खाता सेव करें & SP-ID प्राप्त करें
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="partnerDashboard" class="hidden max-w-md mx-auto space-y-4 p-4">

        <!-- Header Bar -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex justify-between items-center">
            <div>
                <div class="flex items-center gap-2">
                    <h2 id="pName" class="font-bold text-white text-base">---</h2>
                    <span id="pSpId" class="text-[10px] font-mono bg-blue-900 text-blue-200 px-1.5 py-0.5 rounded">SP-0000</span>
                </div>
                <p id="pExpert" class="text-xs text-gray-400">---</p>
            </div>

            <!-- Online / Offline Toggle -->
            <div class="flex items-center gap-2">
                <span id="statusLabel" class="text-xs font-bold text-red-400">OFFLINE</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="onlineToggle" onchange="toggleOnlineStatus()" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                </label>
            </div>
        </div>

        <div class="flex justify-between items-center text-xs">
            <span class="text-gray-400">लॉगिन मोबाइल: <b id="pPhone" class="text-white"></b></span>
            <button onclick="logout()" class="text-red-400 underline font-bold">लॉगआउट / नंबर बदलें</button>
        </div>

        <!-- Assigned Tasks -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-300 text-sm">आज के कार्य (Assigned Bookings)</h3>
                <button onclick="loadAssignedTasks()" class="text-xs text-blue-400 font-semibold"><i class="fa-solid fa-rotate"></i> रिफ्रेश</button>
            </div>
            <div id="partnerTasksList" class="space-y-4"></div>
        </div>

    </div>

    <!-- INVOICE MODAL -->
    <div id="invoiceModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-md p-5 space-y-4 max-h-[90vh] overflow-y-auto text-white">
            <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                <h3 class="font-bold text-lg text-blue-400">इनवॉइस जनरेट करें</h3>
                <button onclick="closeInvoiceModal()" class="text-gray-400 text-xl">&times;</button>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2">एडमिन मास्टर रेट कार्ड (लाइव रेट्स):</label>
                <div id="rateCardSelectorList" class="space-y-2 max-h-40 overflow-y-auto border border-gray-700 p-2 rounded bg-gray-900"></div>
            </div>

            <div class="bg-gray-900 p-3 rounded-lg border border-gray-700">
                <div class="flex justify-between font-bold text-lg">
                    <span>कुल बिल अमाउंट:</span>
                    <span class="text-green-400" id="modalTotalAmount">₹0</span>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-gray-400">भुगतान का तरीका:</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setPayMode('CASH')" id="btnPayCash" class="p-3 border border-gray-600 rounded-lg font-bold text-center bg-green-600 text-white">
                        <i class="fa-solid fa-money-bill-wave mr-1"></i> Cash (नकद)
                    </button>
                    <button onclick="setPayMode('ONLINE')" id="btnPayOnline" class="p-3 border border-gray-600 rounded-lg font-bold text-center bg-gray-700">
                        <i class="fa-solid fa-qrcode mr-1"></i> QR / Online
                    </button>
                </div>
            </div>

            <button onclick="submitFinalInvoice()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl">
                जॉब एंड करें एवं व्हाट्सएप इनवॉइस भेजें
            </button>
        </div>
    </div>

    <script>
        let currentPartner = null;
        let selectedBookingId = null;
        let selectedItems = [];
        let chosenPayMode = 'CASH';

        function getBookings() { return JSON.parse(localStorage.getItem('mk_bookings') || '[]'); }
        function saveBookings(d) { localStorage.setItem('mk_bookings', JSON.stringify(d)); }
        function getTechs() { return JSON.parse(localStorage.getItem('mk_techs') || '[]'); }
        function saveTechs(d) { localStorage.setItem('mk_techs', JSON.stringify(d)); }
        function getRateCard() { return JSON.parse(localStorage.getItem('mk_ratecard') || '[]'); }

        window.onload = function() {
            const savedPhone = localStorage.getItem('mk_active_partner_phone');
            if(savedPhone) {
                const techs = getTechs();
                const existing = techs.find(t => t.phone === savedPhone);
                if(existing) {
                    currentPartner = existing;
                    showDashboard();
                }
            }
        };

        function handlePhoneSubmit() {
            const phone = document.getElementById('loginPhone').value.trim();
            if(phone.length !== 10) { alert('कृपया 10 अंकों का सही मोबाइल नंबर डालें'); return; }

            const techs = getTechs();
            const existing = techs.find(t => t.phone === phone);

            if(existing) {
                currentPartner = existing;
                localStorage.setItem('mk_active_partner_phone', phone);
                showDashboard();
            } else {
                document.getElementById('regForm').classList.remove('hidden');
            }
        }

        function completeRegistration() {
            const phone = document.getElementById('loginPhone').value.trim();
            const name = document.getElementById('regName').value.trim();
            const address = document.getElementById('regAddress').value.trim();
            const expert = document.getElementById('regExpert').value;

            if(!name) { alert('कृपया अपना नाम भरें'); return; }

            const techs = getTechs();
            currentPartner = {
                spId: 'SP-' + Math.floor(1000 + Math.random() * 9000),
                name, phone, address, expert,
                isOnline: true
            };

            techs.push(currentPartner);
            saveTechs(techs);
            localStorage.setItem('mk_active_partner_phone', phone);
            showDashboard();
        }

        function logout() {
            localStorage.removeItem('mk_active_partner_phone');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('partnerDashboard').classList.remove('hidden');
            
            document.getElementById('pName').innerText = currentPartner.name;
            document.getElementById('pSpId').innerText = currentPartner.spId;
            document.getElementById('pExpert').innerText = currentPartner.expert;
            document.getElementById('pPhone').innerText = currentPartner.phone;
            document.getElementById('onlineToggle').checked = currentPartner.isOnline;
            updateStatusLabel(currentPartner.isOnline);

            loadAssignedTasks();
        }

        function toggleOnlineStatus() {
            const isChecked = document.getElementById('onlineToggle').checked;
            currentPartner.isOnline = isChecked;
            updateStatusLabel(isChecked);

            const techs = getTechs();
            const idx = techs.findIndex(t => t.spId === currentPartner.spId);
            if(idx !== -1) {
                techs[idx].isOnline = isChecked;
                saveTechs(techs);
            }
        }

        function updateStatusLabel(isOnline) {
            const lbl = document.getElementById('statusLabel');
            lbl.innerText = isOnline ? 'ONLINE' : 'OFFLINE';
            lbl.className = "text-xs font-bold " + (isOnline ? 'text-green-400' : 'text-red-400');
        }

        function loadAssignedTasks() {
            const bookings = getBookings().filter(b => b.technicianId === currentPartner.spId);
            const container = document.getElementById('partnerTasksList');

            if(bookings.length === 0) {
                container.innerHTML = `<div class="bg-gray-800 p-6 text-center text-gray-400 rounded-xl text-xs">आपको कोई काम असाइन नहीं है।</div>`;
                return;
            }

            container.innerHTML = bookings.map(b => `
                <div class="bg-gray-800 border border-gray-700 p-4 rounded-xl space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-mono text-blue-400 font-bold">${b.id}</span>
                            <h4 class="font-bold text-white text-base">${b.name}</h4>
                        </div>
                        <span class="text-[11px] px-2 py-0.5 rounded font-bold bg-blue-900 text-blue-200">${b.status}</span>
                    </div>

                    <p class="text-xs text-gray-300"><b>सर्विस:</b> ${b.service}</p>
                    <p class="text-xs text-gray-300"><b>पता:</b> ${b.address}</p>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <a href="tel:${b.phone}" class="bg-gray-700 text-center text-xs py-2 rounded text-green-400 font-bold">
                            <i class="fa-solid fa-phone mr-1"></i> कॉल करें
                        </a>
                        <a href="https://maps.google.com/?q=${encodeURIComponent(b.address)}" target="_blank" class="bg-gray-700 text-center text-xs py-2 rounded text-blue-400 font-bold">
                            <i class="fa-solid fa-location-arrow mr-1"></i> गूगल मैप्स
                        </a>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-700 text-xs">
                        <button onclick="updateJobStatus('${b.id}', 'On The Way')" class="p-2 bg-blue-600 rounded font-bold">1. On The Way</button>
                        <button onclick="updateJobStatus('${b.id}', 'Inspection')" class="p-2 bg-indigo-600 rounded font-bold">2. Inspection</button>
                        <button onclick="setEstimate('${b.id}')" class="p-2 bg-yellow-600 rounded font-bold">3. Estimate Approval</button>
                        <button onclick="setSparePartPending('${b.id}')" class="p-2 bg-red-600 rounded font-bold">4. Spare Part Pending</button>
                    </div>

                    <button onclick="openInvoiceModal('${b.id}')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-xs mt-2">
                        <i class="fa-solid fa-file-invoice mr-1"></i> जॉब कम्पलीट & इनवॉइस जनरेट करें
                    </button>
                </div>
            `).join('');
        }

        function updateJobStatus(id, status) {
            const bookings = getBookings();
            const idx = bookings.findIndex(b => b.id === id);
            if(idx !== -1) {
                bookings[idx].status = status;
                saveBookings(bookings);
                loadAssignedTasks();
                alert(`स्टेटस बदलकर "${status}" कर दिया गया है!`);
            }
        }

        function setEstimate(id) {
            const est = prompt("अनुमानित खर्चा (Estimate Amount ₹) दर्ज करें:");
            if(!est) return;
            const bookings = getBookings();
            const idx = bookings.findIndex(b => b.id === id);
            if(idx !== -1) {
                bookings[idx].status = 'Estimate Approval';
                bookings[idx].estimateAmount = parseInt(est);
                saveBookings(bookings);
                loadAssignedTasks();
                alert("कस्टमर को एस्टीमेट भेजा गया!");
            }
        }

        function setSparePartPending(id) {
            const reason = prompt("कौन सा पार्ट पेंडिंग है?");
            const date = prompt("सामान किस तारीख तक आएगा?");
            if(!reason || !date) return;

            const bookings = getBookings();
            const idx = bookings.findIndex(b => b.id === id);
            if(idx !== -1) {
                bookings[idx].status = 'Pending Spare Parts';
                bookings[idx].pendingReason = reason;
                bookings[idx].expectedDate = date;
                saveBookings(bookings);
                loadAssignedTasks();
                alert("जॉब पेंडिंग मार्क किया गया!");
            }
        }

        function openInvoiceModal(id) {
            selectedBookingId = id;
            selectedItems = [];
            document.getElementById('invoiceModal').classList.remove('hidden');

            const rateCard = getRateCard();
            const listContainer = document.getElementById('rateCardSelectorList');

            if(rateCard.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-gray-400 p-2">रेट कार्ड खाली है। एडमिन ऐप से रेट ऐड करें।</p>`;
            } else {
                listContainer.innerHTML = rateCard.map(r => `
                    <label class="flex items-center justify-between p-2 bg-gray-800 rounded text-xs">
                        <span>${r.name} (${r.category})</span>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-green-400">₹${r.price}</span>
                            <input type="checkbox" onchange="toggleItem('${r.name}', ${r.price}, this.checked)">
                        </div>
                    </label>
                `).join('');
            }

            calculateTotal();
        }

        function toggleItem(name, price, isChecked) {
            if(isChecked) {
                selectedItems.push({ name, price });
            } else {
                selectedItems = selectedItems.filter(i => i.name !== name);
            }
            calculateTotal();
        }

        function calculateTotal() {
            const total = selectedItems.reduce((s, i) => s + i.price, 0);
            document.getElementById('modalTotalAmount').innerText = '₹' + total;
        }

        function setPayMode(mode) {
            chosenPayMode = mode;
            document.getElementById('btnPayCash').className = "p-3 border rounded-lg font-bold text-center " + (mode==='CASH'?'bg-green-600 text-white border-green-500':'bg-gray-700 text-gray-300');
            document.getElementById('btnPayOnline').className = "p-3 border rounded-lg font-bold text-center " + (mode==='ONLINE'?'bg-blue-600 text-white border-blue-500':'bg-gray-700 text-gray-300');
        }

        function closeInvoiceModal() {
            document.getElementById('invoiceModal').classList.add('hidden');
        }

        function submitFinalInvoice() {
            const total = selectedItems.reduce((s, i) => s + i.price, 0);
            if(total === 0) { alert('कम से कम एक सामान या सर्विस चुनें!'); return; }

            const bookings = getBookings();
            const idx = bookings.findIndex(b => b.id === selectedBookingId);
            if(idx !== -1) {
                bookings[idx].status = 'Completed';
                bookings[idx].amount = total;
                bookings[idx].paymentMode = chosenPayMode;
                bookings[idx].items = selectedItems;
                saveBookings(bookings);

                closeInvoiceModal();
                loadAssignedTasks();

                const b = bookings[idx];
                const msg = `*M.K. SERVICE - बिल इनवॉइस*\n\nग्राह का नाम: ${b.name}\nसर्विस ID: ${b.id}\nसामान/सेवाएं:\n${selectedItems.map(i => `- ${i.name}: ₹${i.price}`).join('\n')}\n\n*कुल भुगतान:* ₹${total} (${chosenPayMode})\n*पार्टनर:* ${currentPartner.name} (${currentPartner.spId})\n\nM.K. SERVICE चुनने के लिए धन्यवाद!`;
                window.open(`https://wa.me/91${b.phone}?text=${encodeURIComponent(msg)}`, '_blank');
            }
        }
    </script>
</body>
</html>
